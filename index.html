<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Focus Mine</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body { margin: 0; padding: 0; background: #0d1117; color: white; font-family: Arial; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; overflow: hidden; }
        .circle { width: 200px; height: 200px; border-radius: 50%; background: radial-gradient(circle, #007bff 0%, #001a33 100%); box-shadow: 0 0 30px #007bff; margin-bottom: 20px; transition: all 0.3s ease-in-out; }
        .pulsing { animation: pulse 2s infinite alternate; }
        @keyframes pulse { 0% { transform: scale(1); box-shadow: 0 0 20px inherit, 0 0 40px inherit; } 100% { transform: scale(1.1); box-shadow: 0 0 40px inherit, 0 0 80px inherit; } }
        .timer { font-size: 40px; font-weight: bold; margin-bottom: 20px; }
        .btn { padding: 15px 30px; font-size: 18px; color: white; background: #238636; border: none; border-radius: 10px; margin-top: 10px; cursor: pointer; display: none; }
    </style>
</head>
<body>
    <div class="circle" id="circle"></div>
    <div class="timer" id="timer">0.0s</div>
    <button class="btn" id="startBtn" style="display: block; background: #007bff;">Начать фокус</button>
    <button class="btn" id="claimBtn">Забрать SFP</button>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();
        let isMining = false;
        let seconds = 0;
        let timerInterval;

        const circle = document.getElementById('circle');
        const timerDisplay = document.getElementById('timer');
        const startBtn = document.getElementById('startBtn');
        const claimBtn = document.getElementById('claimBtn');

        function applySkin(skinName) {
            const colors = {
                'blue': { main: '#007bff', dark: '#001a33', shadow: '#007bff' },
                'red': { main: '#ff3333', dark: '#330000', shadow: '#ff3333' },
                'green': { main: '#33ff33', dark: '#003300', shadow: '#33ff33' },
                'purple': { main: '#9933ff', dark: '#1a0033', shadow: '#9933ff' }
            };
            const theme = colors[skinName] || colors['blue'];
            circle.style.background = `radial-gradient(circle, ${theme.main} 0%, ${theme.dark} 100%)`;
            circle.style.boxShadow = `0 0 30px ${theme.shadow}`;
            
            const styleSheet = document.styleSheets[0];
            const keyframes = `@keyframes pulse { 0% { transform: scale(1); box-shadow: 0 0 20px ${theme.shadow}, 0 0 40px ${theme.shadow}; } 100% { transform: scale(1.1); box-shadow: 0 0 40px ${theme.shadow}, 0 0 80px ${theme.shadow}; } }`;
            styleSheet.insertRule(keyframes, styleSheet.cssRules.length);
        }

        if (tg.initDataUnsafe && tg.initDataUnsafe.user) {
            const userId = tg.initDataUnsafe.user.id;
            fetch('https://focus-mine-bot.onrender.com/get_skin/' + userId)
                .then(response => response.text())
                .then(skinName => {
                    applySkin(skinName);
                })
                .catch(err => console.log('Ошибка загрузки скина:', err));
        }

        startBtn.onclick = function() {
            if (isMining) return;
            isMining = true;
            seconds = 0;
            this.style.display = 'none';
            claimBtn.style.display = 'none';
            circle.classList.add('pulsing');
            
            timerInterval = setInterval(() => {
                seconds += 0.1;
                timerDisplay.innerText = seconds.toFixed(1) + 's';
                if (seconds > 5) claimBtn.style.display = 'block';
            }, 100);
        };

        claimBtn.onclick = function() {
            if (seconds > 0) {
                claimBtn.disabled = true;
                claimBtn.innerText = "Отправка...";
                
                const chatId = tg.initDataUnsafe.user.id;
                const url = 'https://focus-mine-bot.onrender.com/claim?user_id=' + chatId + '&seconds=' + seconds.toFixed(1);
                
                fetch(url).catch(e => console.log(e));
                
                setTimeout(() => {
                    tg.close();
                }, 1000);
            }
        };

        document.addEventListener("visibilitychange", () => {
            if (document.hidden && isMining) {
                clearInterval(timerInterval);
                isMining = false;
                circle.classList.remove('pulsing');
                startBtn.style.display = 'block';
                startBtn.innerText = "Попробовать снова";
            }
        });
    </script>
</body>
</html>
