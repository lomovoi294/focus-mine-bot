<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Focus Mine</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body { margin: 0; padding: 0; background: #0d1117; color: white; font-family: Arial; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; }
        .circle { width: 200px; height: 200px; border-radius: 50%; background: radial-gradient(circle, #007bff 0%, #001a33 100%); box-shadow: 0 0 30px #007bff; margin-bottom: 20px; }
        .timer { font-size: 40px; font-weight: bold; }
        .btn { padding: 15px 30px; font-size: 18px; color: white; background: #238636; border: none; border-radius: 10px; margin-top: 20px; display: none; cursor: pointer; }
    </style>
</head>
<body>
    <div class="circle"></div>
    <div class="timer" id="timer">0.0s</div>
    <button class="btn" id="startBtn" style="display: block; background: #007bff;">Начать</button>
    <button class="btn" id="claimBtn">Забрать</button>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();
        let isMining = false;
        let seconds = 0;
        let timer;

        document.getElementById('startBtn').onclick = function() {
            if (isMining) return;
            isMining = true;
            seconds = 0;
            this.style.display = 'none';
            document.getElementById('claimBtn').style.display = 'none';
            
            timer = setInterval(() => {
                seconds += 0.1;
                document.getElementById('timer').innerText = seconds.toFixed(1) + 's';
                if (seconds > 5) document.getElementById('claimBtn').style.display = 'block';
            }, 100);
        };

        document.getElementById('claimBtn').onclick = function() {
            if (seconds > 0) {
                const chatId = tg.initDataUnsafe.user.id;
                const url = 'https://focus-mine-bot.onrender.com/claim?user_id=' + chatId + '&seconds=' + seconds.toFixed(1);
                
                // Отправляем запрос и показываем результат на экране
                fetch(url)
                    .then(res => res.text())
                    .then(text => alert("Ответ сервера: " + text))
                    .catch(err => alert("Ошибка: " + err));
            }
        };

        document.addEventListener("visibilitychange", () => {
            if (document.hidden && isMining) {
                clearInterval(timer);
                isMining = false;
                document.getElementById('startBtn').style.display = 'block';
                document.getElementById('startBtn').innerText = "Снова";
            }
        });
    </script>
</body>
</html>
