<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Focus Mine</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body { margin: 0; padding: 0; background: #0d1117; color: white; font-family: Arial; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; overflow: hidden; }
        
        .circle { 
            width: 200px; height: 200px; border-radius: 50%; 
            background: radial-gradient(circle, #007bff 0%, #001a33 100%); 
            box-shadow: 0 0 30px #007bff; margin-bottom: 20px;
            transition: all 0.3s ease-in-out;
        }
        .pulsing { animation: pulse 2s infinite alternate; }
        @keyframes pulse { 
            0% { transform: scale(1); box-shadow: 0 0 20px #007bff, 0 0 40px #007bff; } 
            100% { transform: scale(1.1); box-shadow: 0 0 40px #007bff, 0 0 80px #007bff; } 
        }

        .timer { font-size: 40px; font-weight: bold; margin-bottom: 20px; }
        .btn { padding: 15px 30px; font-size: 18px; color: white; background: #238636; border: none; border-radius: 10px; margin-top: 10px; cursor: pointer; display: none; }
    </style>
</head>
<body>
    <div class="circle" id="circle"></div>
    <div class="timer" id="timer">0.0s</div>
    <button class="btn" id="startBtn" style="display: block; background: #007bff;">Начать фокус</button>
    <button class="btn" id="claimBtn">Забрать SFP</button>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();
        let isMining = false;
        let seconds = 0;
        let timerInterval;

        const circle = document.getElementById('circle');
        const timerDisplay = document.getElementById('timer');
        const startBtn = document.getElementById('startBtn');
        const claimBtn = document.getElementById('claimBtn');

        startBtn.onclick = function() {
            if (isMining) return;
            isMining = true;
            seconds = 0;
            
            this.style.display = 'none';
            claimBtn.style.display = 'none';
            circle.classList.add('pulsing');
            
            timerInterval = setInterval(() => {
                seconds += 0.1;
                timerDisplay.innerText = seconds.toFixed(1) + 's';
                if (seconds > 5) claimBtn.style.display = 'block';
            }, 100);
        };

        claimBtn.onclick = function() {
    if (seconds > 0) {
        claimBtn.disabled = true;
        claimBtn.innerText = "Отправка...";
        
        try {
            const chatId = tg.initDataUnsafe.user.id;
            // Если chatId нет, покажем ошибку (для отладки)
            if (!chatId) {
                alert("Ошибка: Telegram не передал ваш ID. Попробуйте перезапустить бота.");
                claimBtn.disabled = false;
                claimBtn.innerText = "Забрать SFP";
                return;
            }

            const url = 'https://focus-mine-bot.onrender.com/claim?user_id=' + chatId + '&seconds=' + seconds.toFixed(1);
            
            // keepalive: true не дает браузеру отменить запрос при закрытии
            fetch(url, { keepalive: true }).then(() => {
                tg.close(); 
            }).catch((e) => {
                alert("Ошибка сети: " + e);
                claimBtn.disabled = false;
                claimBtn.innerText = "Забрать SFP";
            });
        } catch (e) {
            alert("Ошибка: " + e.message);
            claimBtn.disabled = false;
        }
    }
};

        document.addEventListener("visibilitychange", () => {
            if (document.hidden && isMining) {
                clearInterval(timerInterval);
                isMining = false;
                circle.classList.remove('pulsing');
                startBtn.style.display = 'block';
                startBtn.innerText = "Попробовать снова";
            }
        });
    </script>
</body>
</html>
